name: deSEC Domain Keep-Alive

on:
  schedule:
    # 每周一上午 8 点（UTC）自动触发运行
    - cron: '0 8 * * 1'
  workflow_dispatch: # 支持在 GitHub 后台手动点击运行测试

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Touch deSEC Keep-Alive Record
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          # 替换为你的域名（支持二级域名如 cdn.dedyn.io 或三级域名如 i.cdn.dedyn.io）
          DOMAIN: "i.cdn.dedyn.io"
        run: |
          # 获取当前时间戳
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "Updating keep-alive record for $DOMAIN at $TIMESTAMP..."
          
          # 提取在 deSEC 注册的根 Zone 名称（针对 dedyn.io 后缀提取最后三段，如 cdn.dedyn.io）
          ZONE_DOMAIN=$(echo "$DOMAIN" | awk -F. '{if (NF>3) print $(NF-2)"."$(NF-1)"."$NF; else print $0}')
          
          # 计算子域名相对名称 (subname)
          if [ "$DOMAIN" = "$ZONE_DOMAIN" ]; then
            SUBNAME="_keepalive"
          else
            PREFIX=${DOMAIN%.$ZONE_DOMAIN}
            SUBNAME="_keepalive.${PREFIX}"
          fi
          
          echo "Target Zone: $ZONE_DOMAIN | Target Subname: $SUBNAME"
          
          # 1. 尝试使用 PATCH 自动创建或覆盖更新 (批量接口，不会出现单个路径 404)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH "https://desec.io/api/v1/domains/${ZONE_DOMAIN}/rrsets/" \
            -H "Authorization: Token ${DESEC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "[{\"subname\": \"${SUBNAME}\", \"type\": \"TXT\", \"records\": [\"\"keepalive-timestamp: ${TIMESTAMP}\"\"], \"ttl\": 3600}]")
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "Successfully updated deSEC record via PATCH. Status code: $RESPONSE"
          else
            echo "PATCH failed with HTTP $RESPONSE. Trying POST..."
            
            # 2. 如果 PATCH 未命中，降级使用 POST 创建
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://desec.io/api/v1/domains/${ZONE_DOMAIN}/rrsets/" \
              -H "Authorization: Token ${DESEC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"subname\": \"${SUBNAME}\", \"type\": \"TXT\", \"records\": [\"\"keepalive-timestamp: ${TIMESTAMP}\"\"], \"ttl\": 3600}")
              
            if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
              echo "Successfully created deSEC record via POST. Status code: $RESPONSE"
            else
              echo "Failed to update deSEC record. Status code: $RESPONSE"
              exit 1
            fi
          fi
